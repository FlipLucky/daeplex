name: Release

# Triggered by pushing a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Produces: dp / daeplex-api / daeplex-gui for Linux+Windows (one GoReleaser
# run on this job), plus daeplex-gui for macOS (a second job, native macOS
# runner — see .goreleaser.yaml's own comment on why that leg can't be
# cross-compiled from Linux the way Windows's cgo-free build can).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Keep in sync by hand with Taskfile.yaml's GRAMMAR_TAGS var and
  # .goreleaser.yaml's own copy of this same list.
  GRAMMAR_TAGS: grammar_subset,grammar_subset_go,grammar_subset_typescript,grammar_subset_tsx,grammar_subset_javascript,grammar_subset_html,grammar_subset_css,grammar_subset_scss,grammar_subset_php,grammar_subset_dart,grammar_subset_c,grammar_subset_cpp,grammar_subset_yaml,grammar_subset_json,grammar_subset_dockerfile,grammar_subset_markdown

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # daeplex-gui's cgo build links against Wayland/X11/Vulkan dev headers
      # (see gioui.org/doc/install/linux) that aren't present on a bare
      # ubuntu-latest runner — confirmed by a real CI failure ("Package
      # xkbcommon/wayland-client was not found in the pkg-config search
      # path"), not assumed. My own dev machine never hit this locally
      # since it's already a Wayland desktop with these installed.
      - name: Install Linux build dependencies for daeplex-gui (Gio)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev \
            libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-gui:
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build daeplex-gui for macOS
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist-macos
          # arm64 is native to macos-latest runners; amd64 is a same-OS
          # cross-arch build via Xcode's own SDK (not cross-compiling to a
          # different OS, which is the part that genuinely can't work from
          # Linux) — confirmed working via the v0.1.0 release run.
          for ARCH in arm64 amd64; do
            GOOS=darwin GOARCH="$ARCH" CGO_ENABLED=1 go build \
              -tags "${GRAMMAR_TAGS}" -ldflags="-s -w" \
              -o dist-macos/daeplex-gui ./cmd/gui
            tar -C dist-macos -czf "daeplex-gui_${VERSION}_darwin_${ARCH}.tar.gz" daeplex-gui
          done

      - name: Upload macOS GUI binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "daeplex-gui_${VERSION}_darwin_arm64.tar.gz" \
            "daeplex-gui_${VERSION}_darwin_amd64.tar.gz" \
            --repo "${{ github.repository }}"
